<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KJ QR Code Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="main-title">KJ QR Code Generator</h1>
  <div class="container">
    <div class="options">
      <h3>Customize your QR Code</h3>
      <label for="qrText" class="qrText">Text or URL</label>
      <input type="text" id="qrText" placeholder="Type your text or paste a link here">

      <div class="color-picker-container">
        <div class="color-picker">
          <label>Foreground:</label>
          <div class="color-box-wrapper">
            <div id="fgColorBox" class="color-box"></div>
            <input type="color" id="fgPicker" value="#000000" class="color-input">
          </div>
        </div>
        <div class="color-picker">
          <label>Background:</label>
          <div class="color-box-wrapper">
            <div id="bgColorBox" class="color-box"></div>
            <input type="color" id="bgPicker" value="#ffffff" class="color-input">
          </div>
        </div>
      </div>

      <div class="upload-logo">
        <label>Upload Logo (Optional):</label>
        <input type="file" id="logoUpload" accept="image/*">
      </div>

      <div class="size-input">
        <label>Download Size (px):</label>
        <input type="number" id="sizeInput" min="100" max="1000" value="500">
      </div>

      <button id="generateBtn">Generate QR</button>
    </div>

    <div class="preview">
      <h3 id="previewText">Preview</h3>
      <div id="qrContainer">
        <p class="placeholder">Your QR will appear here</p>
      </div>
      <button id="downloadBtn">Download QR Code</button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="https://kezio.netlify.app" target="_blank">More Tools</a>
      <span class="footer-separator">·</span>
      <span>Made by <a href="https://karojunior.netlify.app" target="_blank">Karo Junior</a></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
